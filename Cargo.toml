[package]
name = "avdoc"
version = "0.1.3"
edition = "2021"
description = "free cli for vibecoders"
license = "MIT"
authors = ["Aryan Vishwakarma"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
walkdir = "2"
rayon = "1.12.0"
colored = "3.1.1"
anyhow = "1.0.104"
ignore = "0.4.33"
tree-sitter = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "blocking"] }
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
glob = "0.3.4"
serde_json = "1.0.149"
toml = "1.1.6"
indicatif = "0.18.6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "22.0.1"
regex = "1.13.1"
dialoguer = "0.12.0"
dirs = "7.0.0"
async-trait = "0.1.92"
console = "0.16.3"
owo-colors = "4.4.0"
chrono = "0.4.45"
home = "0.5.12"
crossterm = "0.29.0"
