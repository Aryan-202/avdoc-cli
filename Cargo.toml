[package]
name = "avdoc"
version = "0.1.2"
edition = "2021"
description = "free cli for vibecoders"
license = "MIT"
authors = ["Aryan Vishwakarma"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
walkdir = "2"
rayon = "1"
colored = "3.1.1"
anyhow = "1"
ignore = "0.4.25"
tree-sitter = "0.26.8"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio = { version = "1.51.0", features = ["full"] }
thiserror = "2.0.18"
glob = "0.3.3"
serde_json = "1.0.149"
toml = "1.1.2+spec-1.1.0"
indicatif = "0.18.4"
ratatui = "0.30.0"
pulldown-cmark = "0.13.3"
pulldown-cmark-to-cmark = "22.0.0"
regex = "1.12.3"
dialoguer = "0.12.0"
dirs = "6.0.0"
async-trait = "0.1.89"
console = "0.16.3"
owo-colors = "4.3.0"
chrono = "0.4.44"
home = "0.5.12"
